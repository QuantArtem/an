name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Lint, unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt openapi-spec-validator
      - run: ruff check .
      - name: Validate OpenAPI specifications
        run: |
          for f in docs/05-integration/openapi/*.yaml; do
            python -m openapi_spec_validator "$f"
          done
      - run: python -m pytest -q

  e2e:
    name: End-to-end scenarios
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Start the stand
        run: docker compose up -d --build
      - run: python -m pytest tests/e2e -v
      - name: Resilience check
        run: ./scripts/resilience_check.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color | tail -n 300

# Локальный стенд LockerFlow: docker compose up --build
name: lockerflow

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP: kafka:9092

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./deploy/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in shipment.events locker.events payment.events lockerflow.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done

  shipment-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: shipment_service } }
    environment:
      <<: *kafka-env
      DATABASE_URL: postgresql://shipment:shipment@postgres:5432/shipment_db
      STORAGE_TTL_SECONDS: ${STORAGE_TTL_SECONDS:-259200}
    ports: ["8001:8000"]

  locker-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: locker_service } }
    environment:
      <<: *kafka-env
      DATABASE_URL: postgresql://locker:locker@postgres:5432/locker_db
      PICKUP_CODE_PEPPER: local-stand-pepper
    ports: ["8002:8000"]

  payment-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: payment_service } }
    environment:
      <<: *kafka-env
      DATABASE_URL: postgresql://payment:payment@postgres:5432/payment_db
      PSP_URL: http://psp-mock:8000
      PSP_WEBHOOK_SECRET: local-stand-webhook-secret
      PAYMENT_WEBHOOK_URL: http://payment-service:8000/api/v1/webhooks/psp
    ports: ["8003:8000"]

  notification-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: notification_service } }
    environment:
      <<: *kafka-env
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification_db
    ports: ["8004:8000"]

  psp-mock:
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: psp_mock } }
    environment:
      PSP_WEBHOOK_SECRET: local-stand-webhook-secret
      PSP_PUBLIC_URL: http://localhost:8010
    ports: ["8010:8000"]

  api-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:8080"]
    depends_on:
      shipment-service: { condition: service_healthy }
      locker-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      psp-mock: { condition: service_healthy }

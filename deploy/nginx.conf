# API Gateway: единая точка входа, маршрутизация по префиксу пути.
# В промышленной среде здесь же: TLS, rate limiting, аутентификация (см. ADR-0007).
events {}
http {
    resolver 127.0.0.11 valid=10s;
    server {
        listen 8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        location = /health { return 200 '{"status":"UP","service":"api-gateway"}'; default_type application/json; }

        location /api/v1/shipments     { set $u shipment-service:8000;     proxy_pass http://$u; }
        location /api/v1/tracking      { set $u shipment-service:8000;     proxy_pass http://$u; }
        location /api/v1/lockers       { set $u locker-service:8000;       proxy_pass http://$u; }
        location /api/v1/payments      { set $u payment-service:8000;      proxy_pass http://$u; }
        location /api/v1/webhooks      { set $u payment-service:8000;      proxy_pass http://$u; }
        location /api/v1/notifications { set $u notification-service:8000; proxy_pass http://$u; }

        location / { return 404 '{"status":404,"code":"ROUTE_NOT_FOUND"}'; default_type application/problem+json; }
    }
}
